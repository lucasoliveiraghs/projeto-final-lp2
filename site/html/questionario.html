<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Protest+Revolution&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="../assets/img/logos/img-link-logo.svg" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <link rel="stylesheet" href="../css/questionario.css">
    <script src="site/js/main.js"></script>
    <title>Ben 10 | Questionário</title>
</head>

<body>
    <header>
        <div class="div-conteiner-header">
            <div class="div-esquerda-header">
                <a href="index.html"><img src="../assets/img/logos/img-link-logo.svg" alt="Logo do site"
                        class="img-logo"></a>
            </div>

            <nav role="navigation" aria-label="main navigation">

                <div class="div-direita-header">
                    <a class="navbar-burger" role="button" aria-label="menu" aria-expanded="false"
                        data-target="navbarBasicExample">
                        <span aria-hidden="true"></span>
                        <span aria-hidden="true"></span>
                        <span aria-hidden="true"></span>
                        <span aria-hidden="true"></span>
                    </a>
                </div>


                <div id="navbarBasicExample" class="navbar-menu">
                    <div class="navbar-start">

                        <a class="navbar-item link-verde">
                            HISTÓRIA
                        </a>

                        <a class="navbar-item link-branco">
                            PERSONAGENS
                        </a>

                        <a class="navbar-item link-verde">
                            QUIZ
                        </a>

                        <a class="navbar-item link-branco">
                            QUESTIONÁRIO
                        </a>

                        <a class="navbar-item link-verde">
                            CRÉDITOS
                        </a>

                    </div>
                </div>
            </nav><!-- pego pelo bulma -->

        </div>
    </header>
    <section class="section-questionario">
        <h1 class="main-title">Questionário</h1>
        <h2 class="subtitle">Nos Dê seu Feedback:</h2>
        <div class="formulario">
            <div class="field">
                <label class="label">Email:</label>
                <div class="control has-icons-left has-icons-right">
                    <input class="input" type="email" placeholder="Digite seu Email">
                    <span class="icon is-small is-left">
                        <i class="fas fa-envelope"></i>
                        <span class="icon is-small is-right">
                            <i class="fas fa-exclamation-triangle"></i>
                        </span>
                </div>
            </div>

            <div class="field">
                <label class="label">Qual sua página favorita:</label>
                <div class="control">
                    <div class="select">
                        <select>
                            <option>Escolha sua página favorita </option>
                            <option>Home</option>
                            <option>Quiz</option>
                            <option>História</option>
                            <option>Personagens</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="field">
                <label class="label">Nos dê suas ideias:</label>
                <div class="control">
                    <textarea class="textarea" placeholder="Acho que ..."></textarea>
                </div>
            </div>
            <div class="field is-grouped">
                <div class="control">
                    <button class="button is-link">Enviar</button>
                </div>
                <div class="control">
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="div-conteiner-footer">
            <div class="div-esquerda-footer">
                <ul class="ul-footer">
                    <h3 class="h3-footer">SEÇÕES DO SITE</h3>
                    <li class="li-footer"><a href="#" class="a-footer">História</a></li>
                    <li class="li-footer"><a href="#" class="a-footer">Personagens</a></li>
                    <li class="li-footer"><a href="#" class="a-footer">Quiz</a></li>
                    <li class="li-footer"><a href="#" class="a-footer">Questionário</a></li>
                    <li class="li-footer"><a href="#" class="a-footer">Créditos</a></li>
            </div>

            <div class="div-direita-footer">
                <ul class="ul-footer">
                    <h3 class="h3-footer">REDES SOCIAIS</h3>

                    <li class="li-footer">
                        <div class="alinhamento"><img src="../assets/img/logos/logo-github.svg" alt=""
                                id="github-logo"><a href="#" class="a-footer">Github.com</a></div>
                    </li>

                    <li class="li-footer">
                        <div class="alinhamento"><img src="../assets/img/logos/logo-whatsapp.svg" alt=""
                                id="whatsapp-logo"><a href="#" class="a-footer">Whatsapp.com</a></div>
                    </li>

                    <li class="li-footer">
                        <div class="alinhamento"><img src="../assets/img/logos/logo-instagram.svg" alt=""
                                id="instagram-logo"><a href="#" class="a-footer">Instagram.com</a></div>
                    </li>
                </ul>
            </div>
        </div>

        <div class="feito-por">
            <p>DESENVOLVIDO POR 2º INFORMÁTICA IFTM</p>
        </div>
    </footer>
</body>

</html>
